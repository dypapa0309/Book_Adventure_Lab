<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="씨앗·가지·숲 중 시작 레벨을 선택해 현재 읽기·추론·표현 기반을 확인하는 진단형 독해력 테스트입니다. 결과를 바로 문자로 문의할 수 있습니다." />

  <!-- ✅ 전환 추적 -->
  <script>window.dataLayer = window.dataLayer || [];</script>
  <script src="/assets/js/analytics.js"></script>
  <!-- Danggeun Market Code -->
  <script src="https://karrot-pixel.business.daangn.com/karrot-pixel.js"></script>
  <script>
    window.karrotPixel.init('1776331082027886001');
    window.karrotPixel.track('ViewPage');
  </script>
  <!-- End Danggeun Market Code -->
  <!-- GTM_HEAD_SNIPPET_START -->
  <!-- TODO: GTM head snippet을 여기에 붙여넣으세요 -->
  <!-- GTM_HEAD_SNIPPET_END -->

  <!-- ✅ 공용 CSS -->
  <link rel="stylesheet" href="/assets/css/common.css" />
  <!-- ✅ 테스트 전용 CSS (공용 뒤에 로드해야 오버라이드가 안전함) -->
  <link rel="stylesheet" href="/assets/css/pages/test.css" />
</head>

<body>
  <main class="test-wrap">
    <!-- 상단 -->
    <div class="test-top">
      <a class="test-back" href="../index.html" aria-label="메인으로 돌아가기">← 메인으로</a>
      <div class="test-muted">책모험 연구소</div>
    </div>

    <!-- 인트로 -->
    <section class="test-card" id="intro">
      <h1 class="test-h1">독해력 테스트</h1>

      <p class="test-muted test-lead">
        씨앗·가지·숲 중 현재 가장 가깝다고 느끼는 시작 레벨을 선택해 진행합니다.<br />
        소요 시간은 약 5~7분이며, 결과 화면에서 현재 적합도와 다음 권장 단계를 안내드립니다.
      </p>

      <div class="test-divider"></div>

      <div class="test-row">
        <button class="btn" id="btn-start" type="button">테스트 시작</button>
        <button class="btn-outline" id="btn-how" type="button">안내 보기</button>
      </div>

      <p class="test-muted test-note">
        * 테스트 결과는 상담 전 참고용 진단이며, 최종 판단은 상담에서 더 정확하게 안내드립니다.
      </p>
    </section>

    <!-- 진행 영역 -->
    <section class="test-card hide" id="test-area" aria-live="polite">
      <div class="test-row test-between">
        <div class="test-muted" id="progress-text">문항 1 / 12</div>
        <div class="test-muted" id="timer-text" title="타이머(선택)"></div>
      </div>

      <div class="test-bar" aria-hidden="true">
        <i id="progress-bar"></i>
      </div>

      <div id="question-wrap">
        <h2 class="q-title" id="q-title">문항이 로딩 중입니다…</h2>
        <div class="q-passage hide" id="q-passage"></div>
        <div class="q-options" id="q-options"></div>
      </div>

      <div class="test-divider"></div>

      <div class="test-row test-between">
        <button class="btn-outline" id="btn-prev" type="button" disabled>이전</button>
        <div class="test-row">
          <button class="btn-outline" id="btn-next" type="button">다음</button>
          <button class="btn hide" id="btn-submit" type="button">제출하기</button>
        </div>
      </div>
    </section>

    <!-- 커뮤니티 -->
    <section class="test-card">
      <h2 class="test-h2">커뮤니티</h2>
      <p class="test-muted test-lead">
        독서모임은 테스트/상담과 별개의 커뮤니티입니다.
      </p>

      <div class="test-row">
        <button
          class="btn-outline"
          id="btn-reading-club"
          type="button"
          data-link="https://example.com/reading-club"
        >
          독서모임 연결하기
        </button>
      </div>

      <p class="test-muted test-note">
        연결 전 확인 팝업이 뜹니다.
      </p>
    </section>

    <!-- footer -->
    <footer class="test-footer">
      © <span id="y" class="y"></span> Book Adventure Lab
    </footer>
  </main>

  <!-- ✅ 공용 모달 1개 (common.js가 제어) -->
  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal__dim" data-close="1"></div>

    <div class="modal__panel" role="document">
      <div class="modal__head">
        <h3 class="modal__title" id="modal-title">알림</h3>
        <button class="modal__close" type="button" data-close="1" aria-label="닫기">닫기</button>
      </div>

      <div class="modal__body" id="modal-body"></div>

      <div class="modal__actions" id="modal-actions">
        <button class="modal__btn" type="button" data-close="1">확인</button>
      </div>
    </div>
  </div>

  <!-- GTM_BODY_NOSCRIPT_START -->
  <!-- TODO: GTM noscript snippet을 여기에 붙여넣으세요 -->
  <!-- GTM_BODY_NOSCRIPT_END -->
  <script src="/assets/js/core/common.js" defer></script>
  <script src="/assets/js/pages/test.js" defer></script>
</body>
</html>
