# ==========================================================
# netlify.toml — Book Adventure Lab
# Netlify 빌드·배포·리다이렉트 설정
# ==========================================================

[build]
  # 빌드 명령 없음 (순수 정적 HTML)
  # build 명령이 필요한 경우 아래 주석 해제
  # command = ""
  publish = "."   # 레포 루트를 퍼블리시 디렉토리로 설정

# ----------------------------------------------------------
# 리다이렉트
# ----------------------------------------------------------
[[redirects]]
  # /thanks 로 접근 시 /thanks/ (슬래시 포함) 로 정규화
  from = "/thanks"
  to   = "/thanks/"
  status = 301

[[redirects]]
  # /test 로 접근 시 /test/ 로 정규화
  from = "/test"
  to   = "/test/"
  status = 301

# ----------------------------------------------------------
# 헤더 (보안) — 상세 헤더는 _headers 파일 참고
# ----------------------------------------------------------
# _headers 파일에서 관리합니다.

# ----------------------------------------------------------
# 폼 알림 (Netlify Forms)
# 배포 후 Netlify 대시보드 → Forms → consult 폼에서
# 이메일 알림 설정을 완료하세요.
